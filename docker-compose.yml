services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: oja
      POSTGRES_PASSWORD: oja
      POSTGRES_DB: oja
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

volumes:
  postgres-data:
